services:
  - type: web
    name: helios-sonics
    runtime: node
    plan: free
    buildCommand: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NASA_DATASET_SOURCE
        value: test-catalog
